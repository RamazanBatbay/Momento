<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Momento - an offline-first travel journal. Capture a photo, pin the place and keep the memory.">
  <meta name="theme-color" content="#0f766e">
  <title>Momento</title>

  <!-- PWA: installability -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="app-header">
    <a href="#/" class="back-link" id="back-link" aria-label="Back to memories" hidden>&larr;</a>
    <h1 class="brand"><a href="#/">Momento</a></h1>
  </header>

  <!-- Views are rendered into this element by the router (js/router.js) -->
  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tab-bar" aria-label="Main">
    <a href="#/" data-route="list">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v2H4zm0 6h16v2H4zm0 6h16v2H4z"/></svg>
      <span>Memories</span>
    </a>
    <a href="#/new" data-route="new">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <span>New memory</span>
    </a>
  </nav>

  <noscript>Momento needs JavaScript to run.</noscript>
</body>
</html>
